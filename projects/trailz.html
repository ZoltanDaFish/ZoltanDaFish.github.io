  <figure>
    <h2 class="label">Shader breakdown</h2>
    <!-- each canvas runs the GLSL in its <script type="x-shader/x-fragment">; sliders drive the uniforms (see js/shaders.js) -->
    <div class="shaders">
      <div class="step">
        <div class="phone"><canvas data-glsl="s1" aria-label="Centred screen-space UVs"></canvas></div>
        <p>1. Centred screen-space UVs</p>
        <label>X offset <input type="range" data-u="offsetX" min="-0.5" max="0.5" step="0.005" value="0"></label>
        <label>Y offset <input type="range" data-u="offsetY" min="-0.5" max="0.5" step="0.005" value="0"></label>
      </div>
      <div class="step">
        <div class="phone"><canvas data-glsl="s2" aria-label="Polar UVs with a twirl"></canvas></div>
        <p>2. Into polar UVs with a small twirl</p>
        <label>Twirl <input type="range" data-u="twirl" min="0" max="3" step="0.01" value="0.8"></label>
      </div>
      <div class="step">
        <div class="phone"><canvas data-glsl="s3" aria-label="Indexed length steps"></canvas></div>
        <p>3. Indexed length steps: floor polarUV.x</p>
        <label>Steps <input type="range" data-u="steps" min="2" max="30" step="1" value="10"></label>
      </div>
      <div class="step">
        <div class="phone"><canvas data-glsl="s4" aria-label="Steps plus the y component"></canvas></div>
        <p>4. Add the y component of the UVs</p>
        <label>Offset per step <input type="range" data-u="offset" min="0" max="0.5" step="0.005" value="0.13"></label>
      </div>
      <div class="step">
        <div class="phone"><canvas data-glsl="s6" aria-label="Lightning arms"></canvas></div>
        <p>5. Repeat the angle into lightning arms: fract(angle * arms)</p>
        <label>Lightning amount <input type="range" data-u="arms" min="1" max="16" step="1" value="4"></label>
        <label>Width <input type="range" data-u="boltWidth" min="0.05" max="0.9" step="0.01" value="0.35"></label>
      </div>
      <div class="step">
        <div class="phone"><canvas data-glsl="s7" aria-label="Animated circles"></canvas></div>
        <p>6. Add the circles animation</p>
        <label>Rings <input type="range" data-u="rings" min="2" max="20" step="1" value="8"></label>
        <label>Speed <input type="range" data-u="speed" min="0" max="2" step="0.01" value="0.5"></label>
        <label>Width <input type="range" data-u="width" min="0.02" max="0.25" step="0.005" value="0.05"></label>
      </div>
    </div>
<script type="x-shader/x-fragment" id="glsl-helpers">
const float TAU = 6.2831853;
// polar UVs: x = distance from centre, y = angle 0..1; twirl bends the angle by distance
vec2 polar(vec2 uv, float tw) {
  uv.x *= aspect;
  float r = length(uv);
  float a = atan(uv.y, uv.x) / TAU + 0.5;
  return vec2(r, fract(a + r * tw + t * 0.05));
}
// the chain: each step builds on the one before, so its sliders carry into every later step
uniform float offsetX, offsetY, twirl, steps, offset;
vec2 centred(vec2 uv) { return uv - vec2(offsetX, offsetY); }               // 1
vec2 polarUV(vec2 uv) { return polar(centred(uv), twirl); }                 // 2
float stepIndex(vec2 uv) { return floor(polarUV(uv).x * steps); }           // 3
vec2 steppedUV(vec2 uv) {                                                   // 4
  vec2 p = polarUV(uv);
  return vec2(p.x, fract(p.y + stepIndex(uv) * offset));
}
</script>
<script type="x-shader/x-fragment" id="s1">
// move the centre point; red = x past it, green = y past it
vec3 frag(vec2 uv) { return vec3(clamp(centred(uv) * 2.0, 0.0, 1.0), 0.0); }
</script>
<script type="x-shader/x-fragment" id="s2">
vec3 frag(vec2 uv) {
  vec2 p = polarUV(uv);
  return vec3(min(p.x * 4.0, 1.0), p.y, 0.0);
}
</script>
<script type="x-shader/x-fragment" id="s3">
vec3 frag(vec2 uv) { return vec3(1.0 - stepIndex(uv) / steps); }
</script>
<script type="x-shader/x-fragment" id="s4">
vec3 frag(vec2 uv) { return vec3(steppedUV(uv).y); }
</script>
<script type="x-shader/x-fragment" id="s6">
uniform float arms, boltWidth;
// repeat the stepped angle into arms (whole number keeps it seamless); distance from .5 of each
// repeat is the arm, and neighbouring steps disagree on where it sits, so its edge is a stair
vec3 frag(vec2 uv) {
  float d = abs(fract(steppedUV(uv).y * arms) - 0.5) * 2.0;
  return vec3(1.0 - smoothstep(boltWidth - 0.04, boltWidth + 0.04, d));
}
</script>
<script type="x-shader/x-fragment" id="s7">
uniform float rings, speed, width;
vec3 frag(vec2 uv) {
  float d = abs(fract(polarUV(uv).x * rings - t * speed) - 0.5);
  return vec3(0.75, 0.1, 0.65) * (1.0 - smoothstep(width * 0.4, width, d));
}
</script>
    <figcaption>The tiered backgrounds are one screen-space shader built in layers, with parameters that give each tier its own look. Drag the sliders to play with each step.</figcaption>
